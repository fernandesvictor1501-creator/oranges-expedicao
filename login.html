<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso administrativo — Oranges</title><style>body{background:#1d0a19;color:#49103d;font:16px Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}form{background:#e3d5c0;border-radius:14px;padding:28px;max-width:440px;width:calc(100% - 32px);box-sizing:border-box}h2{margin-top:0}label{display:block;margin:12px 0}input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #947d6b;border-radius:7px;box-sizing:border-box}button{background:#49103d;color:#e3d5c0;font-weight:bold;width:100%;padding:12px;border:0;border-radius:7px;cursor:pointer}p{font-size:13px}#erro{color:#ab1e32}</style></head><body><form id="form"><h2>Controle de Expedição</h2><p>Acesso exclusivo do administrador</p><label>Usuário<input id="user" autocomplete="username" required value="victor.fernandes"></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><p id="erro"></p><p><a href="/" style="color:#49103d">Visualizar painel público</a></p></form><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const erro=document.getElementById('erro');erro.textContent='Entrando...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('password').value})});if(!r.ok)throw Error('Usuário ou senha inválidos');location.href='/admin'}catch(ex){erro.textContent=ex.message}}</script></body></html>
