/* Oranges — visual renovado, versão 2 */
:root{--bg:#170b16;--ink:#E3D5C0;--paper:#2b1428;--wine:#49103D;--brown:#947D6B}
html{scroll-behavior:smooth}

header{background:rgba(31,11,27,.94)!important;border-bottom:1px solid #ae8e9f!important;box-shadow:0 8px 32px #0e050c77}

.card:hover{transform:translateY(-2px);border-color:#cba9b2!important}
.card .label,.card span{color:#e2cbd8!important}
.card .number,.card strong{color:#fff1e5!important}
.panel{background:linear-gradient(150deg,#32172e,#261127)!important;border:1px solid #896879!important;border-radius:15px!important;box-shadow:0 8px 24px #10040d44}
input,select,textarea{outline:0;transition:border-color .15s ease,box-shadow .15s ease}

button{transition:transform .14s ease,filter .14s ease,box-shadow .14s ease}

function render(){let counts=STATUS.map((_,i)=>cargas.filter(x=>x.status===i).length);$('cards').innerHTML=[['Programados',cargas.length],...STATUS.map((x,i)=>[x,counts[i]])].map(([label,n])=>'<div class="card"><span>'+esc(label.toUpperCase())+'</span><strong>'+n+'</strong></div>').join('');let q=norm($('busca').value),f=$('filtro').value;let rows=cargas.filter(x=>(f===''||String(x.status)===f)&&(!q||FIELDS.some(k=>norm(x[k]).includes(q))));$('lista').innerHTML=rows.length?'<table><thead><tr>'+['Placa','Carga','Pedido','Cliente','Produto','Quantidade','Transportadora','Motorista','Cidade','Frete','Situação','Atualizado'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(x=>'<tr>'+FIELDS.map(k=>'<td data-label="'+({placa:'Placa',carga:'Carga',pedido:'Pedido',cliente:'Cliente',produto:'Produto',quantidade:'Quantidade',transportadora:'Transportadora',motorista:'Motorista',cidade:'Cidade',frete:'Frete'}[k])+'">'+esc(x[k])+'</td>').join('')+'<td data-label="Situação"><span class="pill s'+Number(x.status||0)+'">'+esc(STATUS[x.status]||STATUS[0])+'</span></td><td data-label="Atualizado">'+esc(x.atualizado||'—')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Nenhum carregamento ativo encontrado.</div>';}
$('busca').oninput=render;$('filtro').onchange=render;
async function carregar(){try{const r=await fetch('/api/public',{cache:'no-store'});if(!r.ok)throw Error('Indisponível');const dados=await r.json();cargas=Array.isArray(dados.cargas)?dados.cargas:[];render();$('connection').textContent='● Atualizado ao vivo';$('connection').className='tag ok'}catch(e){$('connection').textContent='● Sem conexão';$('connection').className='tag off';}}
carregar();setInterval(carregar,3000);</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script><nav class="public-mobile-nav" aria-label="Navegação no celular">
<button type="button" class="active" id="mobileGoPanel"><span class="nav-ico">⌂</span>Painel</button>
<button type="button" id="mobileGoSearch"><span class="nav-ico">⌕</span>Buscar</button>
<button type="button" id="mobileRefresh"><span class="nav-ico">↻</span>Atualizar</button>
<button type="button" id="mobileGoTop"><span class="nav-ico">↑</span>Topo</button>
</nav><script>
(function(){
const expanded=new Set();
function drawMobile(){
 const host=document.getElementById('mobileLoads');if(!host||typeof cargas==='undefined')return;
 for(const d of host.querySelectorAll('details[open][data-key]'))expanded.add(d.dataset.key);
 const term=norm(document.getElementById('busca').value),filter=document.getElementById('filtro').value;
 const rows=cargas.filter(x=>(filter===''||String(x.status)===filter)&&(!term||FIELDS.some(k=>norm(x[k]).includes(term))));
 host.innerHTML=rows.length?rows.map((x,i)=>{
 const key=String(x.placa||'')+'|'+String(x.carga||'')+'|'+String(x.pedido||'');
 const statusNum=Math.max(0,Math.min(4,Number(x.status)||0));
 const field=(label,val)=>'<div><span>'+label+'</span><strong>'+esc(val||'—')+'</strong></div>';
 return '<article class="mobile-load-card">'
 +'<div class="mlc-head"><strong class="mlc-plate">🚚 '+esc(x.placa||'Sem placa')+'</strong><span class="pill mlc-status s'+statusNum+'">'+esc(STATUS[statusNum])+'</span></div>'
 +'<div class="mlc-body"><div class="mlc-client">▤ '+esc(x.cliente||'Cliente não informado')+'</div>'
 +'<div class="mlc-main">'+field('Produto',x.produto)+field('Carga',x.carga)+'</div>'
 +'<div class="mlc-sub">'+(x.motorista?'Motorista: <strong>'+esc(x.motorista)+'</strong>': 'Transportadora: <strong>'+esc(x.transportadora||'Não informada')+'</strong>')+'</div></div>'
 +'<details class="mlc-details" data-key="'+esc(key)+'" '+(expanded.has(key)?'open':'')+'><summary>Ver detalhes</summary>'
 +'<div class="mlc-extra">'+field('Pedido',x.pedido)+field('Quantidade',x.quantidade)+field('Transportadora',x.transportadora)+field('Motorista',x.motorista)+field('Cidade',x.cidade)+field('Frete',x.frete)+field('Atualizado',x.atualizado)+'</div>'
 +'</details></article>'
 }).join(''):'<div class="empty">Nenhum carregamento encontrado.</div>';
 host.querySelectorAll('details[data-key]').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)expanded.add(el.dataset.key);else expanded.delete(el.dataset.key)}));
}
const original=render;render=function(){original();drawMobile()};drawMobile();
const search=document.getElementById('busca');
document.getElementById('mobileGoPanel').onclick=()=>document.querySelector('.top')?.scrollIntoView({behavior:'smooth'});
document.getElementById('mobileGoSearch').onclick=()=>{search.scrollIntoView({behavior:'smooth',block:'center'});search.focus({preventScroll:true})};
document.getElementById('mobileRefresh').onclick=()=>carregar();
document.getElementById('mobileGoTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
})();
</script></body></html>
