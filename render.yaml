services:
  - type: web
    name: oranges-expedicao-online
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/fernandesvictor1501-creator/oranges-expedicao
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: victor.fernandes
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oranges-expedicao-db
          property: connectionString
